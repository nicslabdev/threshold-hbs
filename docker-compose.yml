x-trustee-common: &trustee-common
  build:
    context: ./trustee-server
    dockerfile: Dockerfile
  networks:
    - hbs-net
  depends_on:
    cas:
      condition: service_healthy

x-trustee-env: &trustee-env
  TRUSTEE_PORT: "9090"
  TRUSTEE_DB: "/db/trustee.db"
  TRUSTEE_CONFIG: "/db/trustee-config.bin"
  BULLETIN_BOARD_PATH: "/bulletin/board.json"
  CAS_URL: "http://cas:8080"

services:

  # ── CAS: Content Addressable Storage ─────────────────────────────────────
  cas:
    build:
      context: ./cas
      dockerfile: Dockerfile
    environment:
      CAS_PORT: "8080"
      CAS_DATA_DIR: "/data"
    volumes:
      - cas-data:/data
    networks:
      - hbs-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/blobs/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa || true"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Trustees ───────────────────────────────────────────────────────────────
  trustee-0:
    <<: *trustee-common
    environment:
      <<: *trustee-env
      TRUSTEE_INDEX: "0"
    volumes:
      - trustee0-db:/db
      - bulletin:/bulletin

  trustee-1:
    <<: *trustee-common
    environment:
      <<: *trustee-env
      TRUSTEE_INDEX: "1"
    volumes:
      - trustee1-db:/db
      - bulletin:/bulletin

  trustee-2:
    <<: *trustee-common
    environment:
      <<: *trustee-env
      TRUSTEE_INDEX: "2"
    volumes:
      - trustee2-db:/db
      - bulletin:/bulletin

  trustee-3:
    <<: *trustee-common
    environment:
      <<: *trustee-env
      TRUSTEE_INDEX: "3"
    volumes:
      - trustee3-db:/db
      - bulletin:/bulletin

  trustee-4:
    <<: *trustee-common
    environment:
      <<: *trustee-env
      TRUSTEE_INDEX: "4"
    volumes:
      - trustee4-db:/db
      - bulletin:/bulletin

  trustee-5:
    <<: *trustee-common
    environment:
      <<: *trustee-env
      TRUSTEE_INDEX: "5"
    volumes:
      - trustee5-db:/db
      - bulletin:/bulletin

  trustee-6:
    <<: *trustee-common
    environment:
      <<: *trustee-env
      TRUSTEE_INDEX: "6"
    volumes:
      - trustee6-db:/db
      - bulletin:/bulletin

  trustee-7:
    <<: *trustee-common
    environment:
      <<: *trustee-env
      TRUSTEE_INDEX: "7"
    volumes:
      - trustee7-db:/db
      - bulletin:/bulletin

  trustee-8:
    <<: *trustee-common
    environment:
      <<: *trustee-env
      TRUSTEE_INDEX: "8"
    volumes:
      - trustee8-db:/db
      - bulletin:/bulletin

  trustee-9:
    <<: *trustee-common
    environment:
      <<: *trustee-env
      TRUSTEE_INDEX: "9"
    volumes:
      - trustee9-db:/db
      - bulletin:/bulletin

  # ── Dealer: contenedor efímero de setup ───────────────────────────────────
  dealer:
    build:
      context: ./dealer-cli
      dockerfile: Dockerfile
    environment:
      CAS_URL: "http://cas:8080"
      BULLETIN_BOARD_PATH: "/bulletin/board.json"
      SETUP_CONFIG_PATH: "/config/setup-config.json"
      TRUSTEE_URLS: "${KLL_TRUSTEE_URLS:-trustee-0:9090,trustee-1:9090,trustee-2:9090}"
    volumes:
      - bulletin:/bulletin
      - "${KLL_SETUP_CONFIG_PATH:-./setup-config.json}:/config/setup-config.json:ro"
    networks:
      - hbs-net
    depends_on:
      cas:
        condition: service_healthy
    profiles:
      - setup   # solo se ejecuta con: docker compose --profile setup up dealer

  # ── Aggregator ────────────────────────────────────────────────────────────
  aggregator:
    build:
      context: ./aggregator-server
      dockerfile: Dockerfile
    environment:
      AGGREGATOR_PORT: "8081"
      CAS_URL: "http://cas:8080"
      BULLETIN_BOARD_PATH: "/bulletin/board.json"
      TRUSTEE_URLS: "${KLL_TRUSTEE_URLS:-trustee-0:9090,trustee-1:9090,trustee-2:9090}"
    volumes:
      - bulletin:/bulletin
    networks:
      - hbs-net
    ports:
      - "8081:8081"   # expuesto al exterior para recibir peticiones de firma
    depends_on:
      cas:
        condition: service_healthy

# ── Volúmenes ──────────────────────────────────────────────────────────────
volumes:
  cas-data:      # blobs del CAS
  trustee0-db:   # SQLite del trustee 0
  trustee1-db:   # SQLite del trustee 1
  trustee2-db:   # SQLite del trustee 2
  trustee3-db:
  trustee4-db:
  trustee5-db:
  trustee6-db:
  trustee7-db:
  trustee8-db:
  trustee9-db:
  bulletin:      # BulletinBoard compartido entre dealer, trustees y aggregator

# ── Red interna ────────────────────────────────────────────────────────────
networks:
  hbs-net:
    driver: bridge
