syntax = "proto3";
package hbs;
option java_package = "es.uma.nicslab.hbs.grpc";
option java_multiple_files = true;
option java_outer_classname = "TrusteeProto";

service TrusteeService {
  rpc Setup (SetupRequest) returns (SetupResponse);
  rpc ShardSign1 (Sign1Request) returns (Sign1Response);
  rpc ShardSign2 (Sign2Request) returns (Sign2Response);
}

// --- Setup (una vez, en tiempo de dealer) ---
message SetupRequest {
  bytes prf_key = 1; // K[t], 32 bytes
}
message SetupResponse {
  bool ok = 1;
}

// --- Ronda 1 ---
message Sign1Request {
  int32 key_id = 1;
  bytes message = 2;
}
message Sign1Response {
  bytes r_t = 1;
  bytes chk_t = 2;
  bool abort = 3;
}

// --- Ronda 2 ---
message Sign2Request {
  int32 key_id = 1;
  bytes r = 2;
  bytes chk_i = 3;
}
message Sign2Response {
  bytes path_t = 1;
  bytes z_t = 2;
  bool abort = 3;
}